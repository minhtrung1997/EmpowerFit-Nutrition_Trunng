name: Deploy to Heroku

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production app
    runs-on: ubuntu-latest
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: house-of-health-pro

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: npm install --global heroku@11.10.0

      - name: Verify Heroku authentication
        run: heroku auth:whoami

      - name: Deploy main branch to Heroku
        run: |
          git config --global credential.https://git.heroku.com.helper "!heroku git:credentials"
          heroku git:remote --app "$HEROKU_APP_NAME"
          git push heroku HEAD:main --force

      - name: Verify web process
        run: heroku ps --app "$HEROKU_APP_NAME"
